<style>
{{ with .Site.Params.contentBackgroundColor }}:root { --bs-body-bg: {{ . | safeCSS }}; }{{ end }}
{{ with .Site.Params.contentTextColor }}:root { --bs-body-color: {{ . | safeCSS }}; }{{ end }}
{{ with .Site.Params.contentLinkColor }}:root { --bs-link-color: {{ . | safeCSS }}; --bs-link-color-rgb: 0, 123, 255; }{{ end }}
{{ with .Site.Params.contentLinkHoverColor }}:root { --bs-link-hover-color: {{ . | safeCSS }}; }{{ end }}

body { min-width: 300px; }
article { padding-bottom: 1em; }
img { max-width: 100%; }

.custom-navbar {
  margin-bottom: 1em;
  height: 60px;
  background-color: {{ with .Site.Params.navbarBackgroundColor }}{{ . | safeCSS }}{{ else }}#212529{{ end }};
}
.custom-navbar a {
  display: inline-block;
  padding: 18px 0;
  margin-right: 1em;
  font-weight: bold;
  color: {{ with .Site.Params.navbarLinkColor }}{{ . | safeCSS }}{{ else }}rgba(255,255,255,.75){{ end }};
}
.custom-navbar a:hover,
.custom-navbar a:focus {
  text-decoration: none;
  color: {{ with .Site.Params.navbarLinkHoverColor }}{{ . | safeCSS }}{{ else }}rgba(255,255,255,1){{ end }};
}

@media print {
  .custom-navbar { display: none; }
  #theme-toggle { display: none; }
}

[data-bs-theme="dark"] .bg-light {
  background-color: #2a2d2f !important;
}
[data-bs-theme="dark"] .text-dark {
  color: var(--bs-body-color) !important;
}
[data-bs-theme="dark"] .feature-icon img.bi,
[data-bs-theme="dark"] .icon-square img.bi,
[data-bs-theme="dark"] .card-footer img,
[data-bs-theme="dark"] header img.bi {
  filter: invert(0.92);
}

[data-bs-theme="dark"] .card-img-top {
  background-color: #f5f5f5;
  border-radius: 0.25rem 0.25rem 0 0;
}

#theme-toggle {
  position: fixed;
  top: 1rem;
  right: 1rem;
  z-index: 1050;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--bs-border-color);
  background-color: var(--bs-body-bg);
  color: var(--bs-body-color);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background-color 0.2s, border-color 0.2s;
}
#theme-toggle:hover { border-color: var(--bs-body-color); }
#theme-toggle svg { width: 20px; height: 20px; }
#theme-toggle .icon-sun { display: none; }
#theme-toggle .icon-moon { display: block; }
[data-bs-theme="dark"] #theme-toggle .icon-sun { display: block; }
[data-bs-theme="dark"] #theme-toggle .icon-moon { display: none; }

{{ with .Site.Params.wrapperMaxWidth }}
.container { max-width: {{ . | safeCSS }}; }
{{ else }}
.container { max-width: 800px; }
{{ end }}

{{ if eq .Site.Params.customCodeStyle true }}
pre {
  display: block;
  padding: 9.5px;
  word-break: break-all;
  word-wrap: break-word;
  background-color: var(--bs-tertiary-bg);
  border: 1px solid var(--bs-border-color);
  border-radius: 4px;
}
pre code {
  padding: 0;
  font-size: inherit;
  color: inherit;
  white-space: pre-wrap;
  background-color: transparent;
  border: none;
  border-radius: 0;
}
code {
  padding: 2px 4px;
  color: inherit;
  background-color: var(--bs-tertiary-bg);
  border: 1px solid var(--bs-border-color);
  border-radius: 4px;
  font-size: .9em;
}
{{ end }}

{{ if eq .Site.Params.customBlockquoteStyle true }}
blockquote,
.blockquote {
  padding: 10px 20px;
  margin: 0 0 20px;
  font-size: 1em;
  border-left: 5px solid var(--bs-secondary-color);
}
{{ end }}
</style>
