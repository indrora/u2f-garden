<!doctype html>
<html lang="en">

{{ partial "head.html" . }}

<body>
  <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
  </button>

  <div class="container">

    {{ partial "nav.html" . }}

    <main>
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="pt-5 my-5 text-muted border-top">
      A Zaibatsutel Project &middot; &copy; <span id="footer-year"></span>
    </footer>
  </div>

  {{ partial "google-analytics-async.html" . }}

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha384-GNFwBvfVxBkLMJpYMOABq3c+d3KnQxudP/mGPkzpZSTYykLBNsZEnG2D9G/X/+7D" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/imagesloaded@4/imagesloaded.pkgd.min.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    var $grid = $('.needs-mason').masonry({ "percentPosition": true });
    $grid.masonry('layout');
    $grid.imagesLoaded().progress(function () {
      $grid.masonry('layout');
    });

    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-bs-theme') || 'light';
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
      media.addEventListener('change', function (e) {
        if (localStorage.getItem('theme')) return;
        document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light');
      });
    })();
  </script>

</body>

</html>
